name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Dataset smoke test
        run: python scripts/generate_dataset.py --out /tmp/math_smoke.jsonl --n 100 --seed 1337
