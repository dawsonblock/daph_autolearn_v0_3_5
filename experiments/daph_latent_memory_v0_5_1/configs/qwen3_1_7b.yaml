seed: 1337
model:
  name: "Qwen/Qwen3-1.7B"
  dtype: "bfloat16"
  trust_remote_code: true
  device_map: "auto"
memory:
  latent_tokens: 8
  encoder_width: 512
  encoder_layers: 2
  dropout: 0.0
  max_state_tokens: 256
training:
  epochs: 3
  batch_size: 2
  grad_accum_steps: 8
  learning_rate: 0.0003
  weight_decay: 0.01
  alignment_weight: 0.25
  answer_weight: 1.0
  max_prompt_tokens: 384
  max_answer_tokens: 48
  teacher_layer_fraction: 0.75
  gradient_clip: 1.0
evaluation:
  bootstrap_samples: 1000
  leakage_max_accuracy: 0.75
  generation_max_new_tokens: 48
  temperature: 0.0
  # Whether model.generate(inputs_embeds=...) returns the embeds prefix as token
  # IDs in addition to the generated continuation. In transformers>=4.51 the
  # embeds path returns ONLY the newly generated tokens, so the default is
  # False. Set to True only after verifying the installed transformers version
  # prepends the prefix; otherwise predictions, token counts, accuracy, and
  # utility will be corrupted by stripping real generated tokens.
  embeds_generate_includes_prefix: false
utility:
  accuracy_weight: 1.0
  latency_weight: 0.01
  token_weight: 0.0001
